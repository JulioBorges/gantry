name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'release/**', 'gantry/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make test
      - run: python3 .agents/skills/gantry/scripts/roadmap.py check
      - run: python3 .agents/skills/gantry/scripts/frontier.py --scope all
  package:
    name: Package Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.20.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run test:package
      - run: npm pack --dry-run --ignore-scripts
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint" -color'
  gates:
    name: CI gates
    if: always()
    needs: [python, package, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          PYTHON: ${{ needs.python.result }}
          PACKAGE: ${{ needs.package.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
        run: test "$PYTHON" = success && test "$PACKAGE" = success && test "$WORKFLOWS" = success
