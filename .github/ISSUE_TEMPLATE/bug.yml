name: Bug report
description: Report a reproducible problem with Gantry.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include Gantry version, harness, OS, commands, and a minimal example. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
