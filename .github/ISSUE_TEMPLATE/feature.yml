name: Feature proposal
description: Propose an improvement before implementing it.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and users affected
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and scope
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How could we verify this improvement?
    validations:
      required: true
